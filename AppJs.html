document.addEventListener('DOMContentLoaded',init);
function init(){bindEvents();initializeAccess();}
function bindEvents(){
  document.addEventListener('click',function(e){
    var nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}
    var act=e.target.closest('[data-action]');if(!act)return;
    var action=act.dataset.action;
    if(action==='close-modal')closeModal();
    if(action==='close-auth-modal')closeAuthModal();
    if(action==='open-auth')openAuthCenter();
    if(action==='auth-reset')resetAuthorization();
    if(action==='auth-retry')retryAfterAuthorization();
    if(action==='edit'){if(state.entity==='surveys')openDetail('surveys',act.dataset.id);else openForm(state.entity,findCurrent(act.dataset.id));}
    if(action==='view-detail')openRelatedDetail(act.dataset.entity||state.entity,act.dataset.id);
    if(action==='detail-back')closeDetail();
    if(action==='detail-edit'){var detailRecord=state.detail&&state.detail.record||{},detailEntity=state.detail.entity,locked=detailEntity==='surveys'?['opportunity_id']:[];openForm(detailEntity,detailRecord,{lockedFields:locked,returnDetail:{entity:detailEntity,id:detailRecord[primaryKey(detailEntity)]}});}
    if(action==='survey-result')openSurveyResultForm();
    if(action==='survey-image-remove')removeSurveyImage(Number(act.dataset.index));
    if(action==='survey-image-view')openSurveyImageLightbox(act.dataset.url,act.dataset.name);
    if(action==='survey-image-close')closeSurveyImageLightbox();
    if(action==='convert-lead')openLeadConversion();
    if(action==='context-add')openContextForm(act.dataset.entity,act.dataset.department||'');
    if(action==='lead-detail-tab'){state.detailTab=act.dataset.tab||'info';renderLeadDetail(state.detail);}
    if(action==='lead-child-add')openLeadContextForm(act.dataset.entity);
    if(action==='customer-hub-tab'){state.customerTab=act.dataset.tab||'info';renderCustomerHub(state.detail);}
    if(action==='project-workspace-tab'){state.projectTab=act.dataset.tab||'overview';renderProjectWorkspace(state.detail);}
    if(action==='production-subtab'){state.productionTab=act.dataset.entity||'production_plans';state.productionEditor=null;renderProjectWorkspace(state.detail);}
    if(action==='production-batch-new')openProductionBatchEditor(act.dataset.entity||state.productionTab);
    if(action==='production-batch-add')addProductionBatchRow();
    if(action==='production-batch-remove')removeProductionBatchRow(Number(act.dataset.index));
    if(action==='production-batch-cancel'){state.productionEditor=null;renderProjectWorkspace(state.detail);}
    if(action==='production-batch-save')saveProductionBatch();
    if(action==='design-task-view'){state.designTaskId=act.dataset.id||'';renderProjectWorkspace(state.detail);}
    if(action==='design-task-back'){state.designTaskId='';renderProjectWorkspace(state.detail);}
    if(action==='design-task-new')openDesignTaskForm('');
    if(action==='design-task-child')openDesignTaskForm(act.dataset.id||'');
    if(action==='design-task-progress')openDesignTaskProgressForm(act.dataset.id||'');
    if(action==='customer-child-add')openContextualChildForm(act.dataset.entity);
    if(action==='invoice-payment')openInvoicePayment();
    if(action==='invoice-create')openForm('invoices',{});
    if(action==='project-create')openForm('projects',{});
    if(action==='invoice-print')window.print();
    if(action==='permissions')openEmployeePermissions(act.dataset.id);
    if(action==='delete')deleteRecord(act.dataset.id);
    if(action==='switch-entity')switchEntity(act.dataset.entity);
    if(action==='select-scenario')selectScenario(act.dataset.id);
    if(action==='demo-next')runScenario('runDemoStep');
    if(action==='demo-all')runScenario('runDemoAll');
    if(action==='acceptance-run')runAcceptanceSuite();
    if(action==='page-prev'&&state.offset>0){state.offset=Math.max(0,state.offset-state.pageSize);loadEntity();}
    if(action==='page-next'&&state.offset+state.pageSize<state.total){state.offset+=state.pageSize;loadEntity();}
    if(action==='close-sidebar')document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('refreshButton').addEventListener('click',refreshCurrent);
  document.getElementById('primaryButton').addEventListener('click',function(){if(state.page==='demo')openDemoForm();else openForm(state.entity,{});});

function label(field){if(field==='leader_user_id'&&state.modal&&state.modal.entity==='design_orders')return'Leader team Thiết kế nhận order';var custom={assignee_user_id:'Người thực hiện',designer_id:'Người thiết kế',assigned_at:'Ngày chia order',template_type:'Loại mẫu',design_template_type:'Loại mẫu Thiết kế',revision_count:'Số lần đổi option',kpi_days:'KPI (ngày)',extended_days:'Số ngày thêm',task_group:'Hạng mục',proposal_url:'PPS / Proposal',proposal_input_url:'PPS / Proposal',work_name:'Tên phân công',parent_design_order_id:'Order Thiết kế cha',due_at:'Ngày trả order',progress_percent:'Tiến độ (%)',result_note:'Kết quả Thiết kế',production_date:'Ngày sản xuất',construction_date:'Ngày thi công',work_date:'Ngày thực hiện',project_item_id:'Hạng mục thi công',work_detail:'Chi tiết công việc',production_file_url:'Hồ sơ sản xuất / SOP',production_status:'Tình trạng sản xuất',completion_at:'Thời gian hoàn thành',material_name:'Tên vật tư',specification:'Quy cách',actual_new_quantity:'Thực tế dùng NVL mới',issue_status:'Tình trạng cấp',accessory_name:'Phụ kiện',preparation_status:'Tình trạng chuẩn bị',paint_name:'Màu / loại sơn',checklist_item:'Nội dung checklist',file_completed:'Đã hoàn thành file',work_completed:'Đã hoàn thành',material:'Chất liệu',sheet_quantity:'Số tấm 1220×2440',product_type:'Loại sản phẩm',demo_paper_1_27_m:'Demo giấy 1.27m',paper_0_914_m:'Giấy 0.914m',paper_1_07_m:'Giấy 1.07m',paper_1_27_m:'Giấy 1.27m',paper_1_52_m:'Giấy 1.52m',total_m2:'Tổng m²',completed:'Hoàn thành',missing_note:'Còn thiếu'};return custom[field]||(state.bootstrap&&state.bootstrap.labels&&state.bootstrap.labels[field])||field.replace(/_/g,' ');}
function statusLabel(category,code){if(code===null||code===undefined||code==='')return '—';var ds=state.bootstrap&&state.bootstrap.dictionaries&&state.bootstrap.dictionaries[category];if(ds){var m=ds.filter(function(x){return String(x.code)===String(code);})[0];if(m)return m.label;}var fb=ENUM_FALLBACK[category];if(fb){var f=fb.filter(function(x){return String(x[0])===String(code);})[0];if(f)return f[1];}return String(code).replace(/_/g,' ');}
function stageLabel(code){var s=(state.bootstrap.demoStages||[]).filter(function(x){return x.code===code;})[0];return s?s.label:(code==='not_started'?'Chưa bắt đầu':statusLabel('project_status',code));}
function lookupDepartment(id){var r=((state.bootstrap.lookups||{}).departments||[]).filter(function(x){return String(x.department_id)===String(id);})[0];return r?r.department_name:(id||'—');}
function lookupUser(id){var r=((state.bootstrap.lookups||{}).users||[]).filter(function(x){return String(x.user_id)===String(id);})[0];return r?(r.full_name||r.email):(id||'—');}
function lookupProject(id){var r=((state.bootstrap.lookups||{}).projects||[]).filter(function(x){return String(x.project_id)===String(id);})[0];return r?r.project_name:(id||'—');}
function formatCell(field,value){if(value===null||value===undefined||value==='')return '<span class="muted">—</span>';if(field.indexOf('_url')>=0||field==='file_url'){var href=safeExternalUrl(value);return href?'<a class="inline-link" href="'+esc(href)+'" target="_blank" rel="noopener">Mở liên kết ↗</a>':'<span class="muted">Liên kết không hợp lệ</span>';}if(field==='progress_percent')return '<div style="display:flex;gap:7px;align-items:center"><div class="progress"><i style="width:'+Number(value)+'%"></i></div><small>'+Number(value)+'%</small></div>';if(field.indexOf('amount')>=0||field==='contract_value'||field==='estimated_value'||field==='unit_price')return esc(money(value));if(field.indexOf('_at')>=0)return esc(shortDateTime(value));if(field.indexOf('_date')>=0||field==='due_date')return esc(shortDate(value));if(field.indexOf('status')>=0||field==='priority'||field==='action_type')return '<span class="status '+esc(String(value))+'">'+esc(statusLabel(field,value))+'</span>';if(typeof value==='boolean')return value?'<span class="status done">Có</span>':'<span class="status">Không</span>';if(field.indexOf('department_id')>=0)return esc(lookupDepartment(value));if(['sales_id','assigned_sales_id','project_manager_id','accountant_id','designer_id','user_id','surveyor_id','requested_by'].indexOf(field)>=0)return esc(lookupUser(value));if(field==='project_id')return '<strong>'+esc(lookupProject(value))+'</strong><br><small class="muted">'+esc(value)+'</small>';if(field==='service_type')return esc(statusLabel('service_type',value));return esc(String(value));}
function safeExternalUrl(value){var text=String(value||'').trim();return /^https:\/\//i.test(text)?text:'';}
function inputType(type){if(type==='date')return'date';if(type==='datetime')return'datetime-local';if(type==='password')return'password';if(['integer','decimal','currency','percent','number'].indexOf(type)>=0)return'number';if(type==='email')return'email';if(type==='url')return'url';return'text';}
function guessType(field){if(field.indexOf('_at')>=0)return'datetime';if(field.indexOf('_date')>=0||field==='due_date')return'date';if(field.indexOf('amount')>=0||field.indexOf('quantity')>=0||field.indexOf('percentage')>=0||field.indexOf('percent')>=0||field.indexOf('days')>=0||field.indexOf('order')>=0)return'number';if(field.indexOf('is_')===0||field.indexOf('_required')>=0)return'boolean';if(field.indexOf('_url')>=0)return'url';return'text';}
function formatInputValue(value,type){if(!value)return'';var s=String(value);if(type==='date')return s.slice(0,10);if(type==='datetime-local')return s.slice(0,16);return s;}
function isSystemField(f){return['created_at','created_by','updated_at','updated_by','deleted_at'].indexOf(f)>=0;}
function money(v){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(v||0));}
function shortDate(v){if(!v)return'—';var d=new Date(v);if(isNaN(d))return String(v);return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);}
function shortDateTime(v){if(!v)return'—';var d=new Date(v);if(isNaN(d))return String(v);return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);}
function futureDate(days){var d=new Date(Date.now()+days*86400000);return d.toISOString().slice(0,10);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
function text(id,value){var el=document.getElementById(id);if(el)el.textContent=value||'';}
function toast(message,error){var el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.getElementById('toastHost').appendChild(el);setTimeout(function(){el.remove();},4000);}
function showInlineError(err){document.getElementById('content').innerHTML='<div class="error-card"><strong>Không thể tải dữ liệu</strong><p>'+esc(err.message||err)+'</p></div>';}
function showFatal(err){setHeader('Không thể khởi động','Kiểm tra hoặc cấp lại quyền Google cho tài khoản hiện tại',false);document.getElementById('content').innerHTML='<div class="error-card"><strong>Ứng dụng chưa có đủ quyền</strong><p>'+esc(err.message||err)+'</p><div class="auth-actions"><button class="button primary" data-action="open-auth">Kiểm tra & cấp lại quyền</button><button class="button ghost" data-action="auth-retry">Thử khởi động lại</button></div></div>';}
function invalidateClientData(){state.entityCache={};state.entityPromises={};state.detailCache={};state.detailPromises={};state.prefetchStarted=false;}
async function refreshBootstrap(){invalidateClientData();warmApplicationData(true);applyUser();return true;}
})();
</script>
